<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación en línea · Caja de Herramientas</title>

    <!-- Estilo de la Caja de Herramientas (copias locales en lib/) -->
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css?v=2.10">
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=2.10">

    <!-- KaTeX (copia local en lib/: funciona sin internet) -->
    <link rel="stylesheet" href="lib/katex/katex.min.css?v=2.10">
    <script src="lib/katex/katex.min.js?v=2.10"></script>
    <script src="lib/katex/contrib/auto-render.min.js?v=2.10"></script>

    <!-- GeoGebra (requiere internet; no admite SRI porque geogebra.org actualiza este archivo) -->
    <script async src="https://www.geogebra.org/apps/deployggb.js"></script>

    <!-- SheetJS para exportar a Excel (copia local en lib/) -->
    <script src="lib/sheetjs/xlsx.full.min.js?v=2.10"></script>

    <link rel="stylesheet" href="css/styles.css?v=2.10">
    <link rel="stylesheet" href="css/app.css?v=2.10">
</head>

<!-- Página del estudiante: mismo estilo que la aplicación, pero sin el menú lateral
     (el estudiante no debe poder abrir el generador ni el análisis desde aquí) -->
<body class="exam-page caja-examen">
    <a class="skip-link" href="#exam-main">Saltar a la evaluación</a>

    <header class="examen-barra">
        <i class="fas fa-pen" aria-hidden="true"></i>
        <span>Evaluación en línea · Caja de Herramientas</span>
    </header>

    <main id="exam-main" class="examen-contenedor tool-container" tabindex="-1">
        <section id="exam-section" aria-labelledby="exam-heading">
            <h1 id="exam-heading" class="h3 mb-3">Evaluación en curso</h1>
            <div id="question-container" aria-live="polite"></div>
            <div class="nav-buttons">
                <button type="button" id="prev-btn" class="nav-btn hidden">Anterior</button>
                <button type="button" id="next-btn" class="nav-btn">Siguiente</button>
                <button type="button" id="finish-btn" class="nav-btn hidden">Finalizar</button>
            </div>
        </section>

        <section id="results-section" class="hidden" aria-labelledby="results-title">
            <h1 id="results-title" class="h3" tabindex="-1">Resultados de la evaluación</h1>
            <div id="score-display" class="score"></div>
            <div id="detailed-results"></div>
            <button type="button" id="close-exam-btn" class="restart-btn">Cerrar evaluación</button>
        </section>
    </main>

    <!-- Configuración (URL de Google Sheets) -->
    <script src="js/config.js?v=2.10"></script>

    <script src="js/avisos.js?v=2.10"></script>
    <script src="js/parametric.js?v=2.10"></script>
    <script src="js/geogebraEstados.js?v=2.10"></script>
    <script src="js/ExamSystem.js?v=2.10"></script>

    <script src="js/exam-page.js?v=2.10"></script>
</body>

</html>
